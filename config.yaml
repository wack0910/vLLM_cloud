# 서버 시작: vllm serve --config config.yaml
# 공식 기본값 전체 덤프가 아니라, L40S 48GB 1장용 실험 시작 설정입니다.
# [기본 유지]와 [실험 설정]을 구분했습니다. 생략한 옵션은 설치 버전의 기본값을 따릅니다.

# [실험 설정] 사용할 모델. FP8 양자화 방식은 체크포인트에서 자동 감지합니다.
model: Qwen/Qwen3.8-27B-FP8

# [실험 설정] 서버와 벤치마크를 같은 서버에서 실행합니다.
host: 127.0.0.1
# [기본 유지]
port: 8000

# [기본 유지] FP8 가중치와 별개로, 나머지 연산/캐시의 dtype을 자동 선택합니다.
dtype: auto
kv-cache-dtype: auto
tensor-parallel-size: 1
pipeline-parallel-size: 1
gpu-memory-utilization: 0.9

# [실험 설정] 문맥 길이는 입력 + 생성 토큰의 합입니다. 원본의 262K 문맥을 사용하지 않습니다.
max-model-len: 4096
# 텍스트 Chat Completions만 사용하여 멀티모달 메모리 사용을 줄입니다.
language-model-only: true

# [실험 설정] 우선 이 두 값을 하나씩 변경하세요. 변경 후에는 서버를 재시작해야 합니다.
# max-num-seqs 후보: 8, 16, 32. 첫 기동 확인 후 32까지 단계적으로 늘립니다.
max-num-seqs: 16
# 한 스케줄링 단계의 토큰 예산. 후보: 1024, 2048, 4096.
max-num-batched-tokens: 2048
# 작은 토큰 예산으로도 긴 입력을 나누어 처리하도록 명시합니다.
enable-chunked-prefill: true

# [실험 설정] 같은 입력을 반복할 때 이전 실행의 prefix cache가 측정에 영향을 주지 않게 합니다.
# 명시적인 --no-enable-prefix-caching 플래그를 사용합니다.
# 일부 CLI 파서는 YAML의 enable-prefix-caching: false를 단순 생략할 수 있습니다.
# PagedAttention 자체를 끄는 옵션은 아닙니다.
no-enable-prefix-caching: true

# [실험 설정] 모델에 저장된 생성 기본값 대신, 요청에 지정한 값을 기준으로 비교합니다.
generation-config: vllm
# Qwen3.8은 thinking이 기본 활성화되어 있으므로 일반 채팅 실험에서는 끕니다.
default-chat-template-kwargs:
  enable_thinking: false

# [기본 유지] CUDA graph를 사용하는 일반 실행 경로. OOM 발생 시에만 true를 별도 비교하세요.
enforce-eager: false
# trust-remote-code / quantization / attention-backend / speculative-config는 강제하지 않습니다.
